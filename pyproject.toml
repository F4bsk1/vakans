[project]
name = "vakans"
version = "0.1.0"
description = "AI reception + capacity matching for Swedish clinics — demo sandbox and ingestion"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pydantic-ai-slim[openai,bedrock,mistral]>=1.0",
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13.9",
    "structlog>=24.4",
    "tenacity>=9.0",
    "trafilatura>=2.0",
    "playwright>=1.49",
    "lxml>=5.3",
    "tzdata>=2024.2",
    "email-validator>=2.2",
]

[project.scripts]
vakans-review = "ingestion.review:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "backend/ingestion"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "DTZ"]
# DTZ is deliberate and non-optional: it bans naive datetime.now()/utcnow(), the exact
# bug class that silently corrupts a DST-sensitive slot grid. See docs/SCHEMA_NOTES.md.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"backend/alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "live: hits the real network (deselected by default)",
    "db_commit: needs real commits, not the savepoint-rollback fixture",
]
addopts = "-m 'not live' --strict-markers"
